<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6 mt-10 text-center">
        <h2 class="text-2xl font-bold mb-4">Password Reset Complete</h2>
        <p class="text-gray-600 mb-6">Your password has been reset successfully. You may now log in with the new password.</p>
        <a href="{% url 'signin' %}" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md font-semibold">
            Login
        </a>
    </div>
</body>
</html>
