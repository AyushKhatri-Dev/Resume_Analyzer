<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6 mt-10">
        <h2 class="text-2xl font-bold mb-4 text-center">Reset Your Password</h2>
        <p class="text-gray-600 mb-6 text-center">Enter your email address to receive a link to reset your password.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md font-semibold">
                Send Reset Link
            </button>
        </form>
    </div>
</body>
</html>
